name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Spotless check (định dạng code)
        run: ./gradlew spotlessCheck

      - name: Checkstyle (chỉ báo cáo, không fail build — xem docs/setup/DECISIONS.md #6)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Unit tests
        run: ./gradlew test

      - name: Integration tests (Testcontainers — Docker có sẵn trên GitHub-hosted runner)
        run: ./gradlew integrationTest

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 14
