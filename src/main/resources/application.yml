# Cấu hình chung cho mọi profile. 3 file application-{dev,test,prod}.yml chỉ GHI ĐÈ những
# gì khác biệt — tránh lặp lại toàn bộ cấu hình ở mỗi profile.
#
# spring.profiles.active mặc định là "dev" để chạy `./gradlew bootRun` local không cần
# truyền thêm flag gì — set biến môi trường SPRING_PROFILES_ACTIVE=prod khi deploy thật.
spring:
  application:
    name: clinic-booking-api
  profiles:
    active: dev
  jackson:
    time-zone: ${app.timezone}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinic_booking}
    username: ${DB_USERNAME:clinic}
    password: ${DB_PASSWORD:clinic}

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:clinic}
    password: ${MQ_PASSWORD:clinic}
    # Publisher confirms: the broker acknowledges every published message.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 10
        # Starts with 1 consumer and grows up to 3 when the queue backs up.
        max-concurrency: 3
        retry:
          enabled: true
          max-retries: 3
          multiplier: 2
          max-interval: 30s
          initial-interval: 2s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  security:
    jwt:
      enabled: ${JWT_ENABLED:false}
      secret: ${JWT_SECRET:}
      issuer: clinic-booking-api
      audience: clinic-booking-api
      lifetime-seconds: 900
      refresh-lifetime-seconds: 604800
      refresh-cookie-name: refresh_token
      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-same-site: Lax
  # Dùng cho @Scheduled(zone=...) và spring.jackson.time-zone — đổi 1 chỗ, áp dụng toàn app.
  timezone: Asia/Ho_Chi_Minh
  cors:
    # Danh sách origin được phép gọi API, phân tách bằng dấu phẩy. KHÔNG BAO GIỜ dùng "*".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        # Chỉ mở health + info — xem docs/setup/DECISIONS.md và README mục Bảo mật.
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
