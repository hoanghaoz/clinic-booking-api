# Profile prod yêu cầu JWT_SECRET hợp lệ. Các hạng mục còn mở như mã hoá cột nhạy cảm
# nằm trong README. Tắt Swagger UI/API docs công khai; secret đọc từ môi trường.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  security:
    jwt:
      enabled: true

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: warn
    com.se100.clinic: info
